<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Merry Christmas</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <div class="lights"></div>
    <main class="card">
      <h1 class="title">Merry Christmas</h1>
      <p class="subtitle">Wishing you a lovely, romantic holiday filled with warmth and hearts.</p>
      <button id="sendLove" class="btn">Send a Heart</button>
      <div class="note">Click anywhere to create floating hearts.</div>
    </main>
    <div id="hearts" aria-hidden="true"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
