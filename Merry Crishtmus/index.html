<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Merry Christmas</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <div class="lights"></div>
    <main class="card">
      <h1 class="title">Merry Christmas</h1>
      <p class="subtitle">May your heart feel light, your home feel warm, and your days be filled with quiet joy and love. 🎄✨</p>
      <button id="sendLove" class="btn">Send a Heart</button>
      <div class="note">Click anywhere to create floating hearts.</div>
    </main>
    <div id="hearts" aria-hidden="true"></div>
  
    <div id="giftModal" class="modal" aria-hidden="true">
      <div class="modal-overlay" id="giftOverlay"></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="giftTitle">
        <div class="gift" id="giftBox">
          <div class="lid"></div>
          <div class="box">
            <img id="giftImage" src="assets/Yashita.png" alt="A little gift" />
          </div>
          <div class="ribbon"></div>
        </div>
        <h2 id="giftTitle">A little gift for you</h2>
        <p class="gift-text">May this bring a warm smile and extra love today.</p>
        <div class="gift-actions">
          <button id="closeGift" class="btn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
